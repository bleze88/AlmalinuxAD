# Source unique de vérité pour l'identité de la distribution.
# Sourcé en shell (bash/zsh) par les scripts de build - syntaxe VAR="valeur" stricte.

# Nom lisible par un humain (branding SDDM/Plasma par défaut, non modifié - voir docs/ARCHITECTURE.md)
DISTRO_NAME="AlmaLinux AD"

# Identifiant court : minuscules, chiffres, tirets uniquement.
DISTRO_ID="almalinux-ad"

# Étiquette de volume ISO9660 : 32 caractères max, MAJUSCULES/chiffres/underscore conseillés.
DISTRO_ISO_LABEL="ALMALINUX_AD"

# Éditeur/publisher.
DISTRO_PUBLISHER="AlmaLinux AD Project <https://example.invalid>"

# Version majeure AlmaLinux ciblée (dernière stable au moment de la création de ce projet).
ALMALINUX_MAJOR="9"

# Version affichée / nom de fichier ISO - typiquement une date, ex: 2026.07.27
DISTRO_VERSION="$(date +%Y.%m.%d)"
