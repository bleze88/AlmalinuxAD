#version=RHEL9
# Kickstart de respin AlmaLinux AD.
#
# Volontairement PARTIEL : les commandes classiques (partitionnement,
# réseau, fuseau horaire, compte utilisateur/mot de passe, clavier...) sont
# omises exprès pour que l'installeur Anaconda affiche son assistant
# graphique NORMAL, interactif, pas-à-pas - voir docs/ARCHITECTURE.md
# ("Pourquoi Kickstart ne bloque pas l'expérience pas-à-pas"). Seuls la
# sélection de logiciels (%packages) et quelques réglages système non
# interactifs par nature (%post) sont pré-remplis ici.
#
# Embarqué sur l'ISO respin par build/02-respin-iso.sh et référencé par
# défaut dans grub.cfg/isolinux.cfg via `inst.ks=cdrom:/ks.cfg`.

# Mini-dépôt local (notre paquet almalinux-ad-firstboot-wizard, voir
# build/01-build-rpm.sh) ajouté par build/02-respin-iso.sh à côté de
# BaseOS/AppStream sur l'ISO. Chemin de montage à reconfirmer au premier
# build réel (voir docs/BUILD.md) : /run/install/repo/ est l'emplacement
# habituel où Anaconda monte le média d'installation pendant l'install,
# mais ce détail dépend de la version d'Anaconda livrée avec cette version
# majeure d'AlmaLinux.
repo --name=AlmaLinuxAD-local --baseurl=file:///run/install/repo/AlmaLinuxAD-local

# Pas d'agent "Initial Setup" au premier boot : l'assistant AD de ce projet
# (packaging/almalinux-ad-firstboot-wizard) gère déjà le premier login,
# inutile de superposer un second écran de configuration "premier démarrage"
# sans rapport.
firstboot --disable

%packages
# Groupe d'environnement KDE Plasma - id à revérifier avec
# `dnf group list -v` sur le point de montage du DVD utilisé (peut évoluer
# entre versions mineures d'AlmaLinux), voir docs/BUILD.md.
@^kde-desktop-environment

# Intégration Active Directory - tous ces paquets sont officiels
# (BaseOS/AppStream), aucun dépôt tiers requis (contrairement au projet
# Arch de référence où realmd/adcli étaient AUR-only).
sssd
sssd-krb5
sssd-ad
sssd-tools
adcli
realmd
samba-common-tools
krb5-workstation
bind-utils

# Création automatique du home directory au premier login d'un compte AD :
# mécanisme OFFICIEL RHEL pour authselect --with-mkhomedir (contrairement
# au projet Arch, où oddjob était AUR-only et pam_mkhomedir.so avait été
# utilisé à la place - voir docs/ARCHITECTURE.md, tableau comparatif).
oddjob
oddjob-mkhomedir

# SELinux (enforcing par défaut sur AlmaLinux, absent du projet Arch de
# référence) : restorecon est fourni par ce paquet, utilisé par le backend
# de l'assistant AD après chaque écriture de fichier de configuration.
policycoreutils

# Notre propre paquet (mini-dépôt local ajouté par build/02-respin-iso.sh) :
# assistant kdialog + backend de jonction AD, voir
# packaging/almalinux-ad-firstboot-wizard/.
almalinux-ad-firstboot-wizard
%end

%post --log=/root/almalinux-ad-post.log
set -x

# PAM/NSS -> sssd via authselect, l'outil OFFICIEL RHEL pour ce câblage
# (contrairement au projet Arch, où l'édition manuelle de system-auth avait
# fini par casser silencieusement `su` - authselect câble correctement
# TOUTES les piles PAM concernées, dont su, en une seule commande).
authselect select sssd with-mkhomedir --force
systemctl enable oddjobd.service

# Journal systemd persistant - ne pas supposer que c'est déjà le comportement
# par défaut d'AlmaLinux, le forcer explicitement dans tous les cas (même
# raisonnement que sur le projet Arch : un plantage nécessitant un
# redémarrage forcé en cours de dépannage ne doit jamais faire perdre les
# logs du démarrage incriminé).
mkdir -p /var/log/journal
mkdir -p /etc/systemd/journald.conf.d
cat > /etc/systemd/journald.conf.d/persistent-storage.conf <<'EOF'
[Journal]
Storage=persistent
EOF

# mDNS best-effort désactivé : systemd-resolved n'est pas actif par défaut
# sur AlmaLinux (contrairement à Arch), mais avahi-daemon peut jouer le même
# rôle perturbateur avec des domaines AD en .local (RFC 6762) - masqué par
# défaut en contexte professionnel, sans effet si le paquet n'est pas
# installé.
systemctl mask avahi-daemon.service avahi-daemon.socket 2>/dev/null || true

# Horloge : chrony est déjà l'unique client NTP actif par défaut sur
# AlmaLinux (pas de systemd-timesyncd concurrent comme sur Arch). Seul
# VMware Tools reste une source de désynchronisation concurrente possible
# si le poste tourne sous VMware (voir docs/AD-JOIN-WIZARD.md) - ce fragment
# est écrit préventivement, sans effet tant qu'open-vm-tools n'est pas
# installé (RPM ne l'écrasera pas au moment de son installation, un fichier
# de config déjà présent est préservé en .rpmnew).
mkdir -p /etc/vmware-tools
cat > /etc/vmware-tools/tools.conf <<'EOF'
[timesync]
disable = TRUE
EOF

%end
